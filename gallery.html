            var type = new URLSearchParams(window.location.search).get("type");
            var config = GALLERIES[type] || GALLERIES.logos;

            var study = CASE_STUDIES[key];

            var grid = document.getElementById("gallery-grid");
            var count = 0;

            document.title = config.title + " | MARO DESIGN";
            document.getElementById("gallery-eyebrow").textContent = config.eyebrow;
            document.getElementById("gallery-title").textContent = config.title;

            var customOrder = document.getElementById("custom-order");
            customOrder.setAttribute("data-service", config.service);

            if (config.dark) {
                grid.classList.add("is-dark");
                grid.style.setProperty("--ratio", config.ratio || "3 / 4");
            }

            if (study) {
                grid.classList.add("is-cases");
                document.getElementById("gallery-title").textContent = study.title;
                document.getElementById("gallery-desc").textContent = study.desc;
            }

            function addCard(number, src) {
                var name = config.label + " رقم " + number;

                var article = document.createElement("article");
                article.className = "logo-item";

                var img = document.createElement("img");
                img.src = src;
                img.alt = "تصميم " + name;
                article.appendChild(img);

                var content = document.createElement("div");
                content.className = "logo-item-content";

                var title = document.createElement("h3");
                title.textContent = name;
                content.appendChild(title);

                var button = document.createElement("a");
                button.className = "order-button";
                button.href = "https://wa.me/" + WHATSAPP;
                button.target = "_blank";
                button.rel = "noopener";
                button.setAttribute("data-design", name);
                button.textContent = "اطلب هذا التصميم";
                content.appendChild(button);

                article.appendChild(content);
                grid.appendChild(article);
                count++;
            }

            function addCase(c) {
                var article = document.createElement("article");
                article.className = "case-study";

                var images = document.createElement("div");
                images.className = "case-images" + (study.natural ? " natural" : "");
                if (study.figMax) { images.style.setProperty("--fig-max", study.figMax); }
                [[c.logo, study.mainLabel, true], [c.mockup, "على أرض الواقع", false]].forEach(function (p) {
                    var fig = document.createElement("figure");
                    var img = document.createElement("img");
                    img.src = p[0];
                    img.alt = c.name + " - " + p[1];
                    img.onerror = function () {
                        if (!p[2]) { fig.style.display = "none"; return; }
                        fig.innerHTML = "";
                        var msg = document.createElement("div");
                        msg.style.cssText = "padding:28px 14px;text-align:center;color:#ffb4b4;font-size:13px;direction:ltr;word-break:break-all";
                        msg.textContent = "Image not found: " + p[0];
                        fig.appendChild(msg);
                    };
                    var cap = document.createElement("figcaption");
                    cap.textContent = p[1];
                    fig.appendChild(img);
                    fig.appendChild(cap);
                    images.appendChild(fig);
                });
                article.appendChild(images);

                var head = document.createElement("div");
                head.className = "case-head";
                var h = document.createElement("h3");
                h.textContent = c.name;
                var tag = document.createElement("span");
                tag.className = "case-tag";
                tag.textContent = c.tag;
                head.appendChild(h);
                head.appendChild(tag);
                article.appendChild(head);

                var ul = document.createElement("ul");
                ul.className = "case-points";
                c.points.forEach(function (p) {
                    var li = document.createElement("li");
                    var s = document.createElement("strong");
                    s.textContent = p[0];
                    li.appendChild(s);
                    li.appendChild(document.createTextNode(p[1]));
                    ul.appendChild(li);
                });
                article.appendChild(ul);

                var result = document.createElement("div");
                result.className = "case-result";
                result.textContent = c.result;
                article.appendChild(result);

                var button = document.createElement("a");
                button.className = "order-button";
                button.href = "https://wa.me/" + WHATSAPP + "?text=" +
                    encodeURIComponent(study.orderMsg + c.name);
                button.target = "_blank";
                button.rel = "noopener";
                button.textContent = study.orderLabel;
                article.appendChild(button);

                grid.appendChild(article);
                count++;
            }

            function finish() {
                if (count === 0) {
                    var empty = document.createElement("p");
                    empty.className = "gallery-empty";
                    empty.textContent = "لسه بنجهّز التصاميم هنا. تقدر تطلب تصميم مخصوص مباشرة من الزرار تحت.";

            }

            // تحميل الصور بالترتيب لحد أول صورة مش موجودة
            function loadNext(number) {
                if (number > MAX_IMAGES) {
                    finish();
                    return;
                }

                var src = config.folder + config.prefix + number + EXTENSION;
                var probe = new Image();

                probe.onload = function () {
                    addCard(number, src);
                    loadNext(number + 1);
                };

                probe.onerror = finish;
                probe.src = src;
            }

            if (study) {
                study.items.forEach(addCase);
                finish();
            } else {
                loadNext(1);
            }
        })();
    </script>
</body>
