<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معاينة الموبايل | MARO DESIGN</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            overflow: hidden;
        }

        body {
            display: grid;
            place-items: center;
            background: radial-gradient(ellipse at 50% 30%, #2a0f45, #08050f 70%);
            font-family: Arial, sans-serif;
        }

        .stage {
            width: 430px;
            height: 884px;
            flex-shrink: 0;
            transform-origin: center center;
        }

        .phone {
            position: relative;
            width: 430px;
            height: 884px;
            padding: 20px;
            border-radius: 68px;
            background: #111;
            border: 3px solid #3a3a3f;
            box-shadow:
                0 0 0 2px #000,
                0 0 60px rgba(161, 0, 255, 0.35),
                0 30px 80px rgba(0, 0, 0, 0.6);
        }

        .screen {
            position: relative;
            width: 390px;
            height: 844px;
            overflow: hidden;
            border-radius: 50px;
            background: #08050f;
        }

        .screen iframe {
            width: 390px;
            height: 844px;
            border: 0;
            background: #08050f;
        }

        /* الجزيرة (Dynamic Island) */
        .island {
            position: absolute;
            top: 12px;
            left: 50%;
            z-index: 5;
            width: 120px;
            height: 34px;
            border-radius: 20px;
            background: #000;
            transform: translateX(-50%);
            pointer-events: none;
        }

        /* الأزرار الجانبية */
        .btn {
            position: absolute;
            width: 4px;
            border-radius: 2px;
            background: #3a3a3f;
        }

        .btn.silent {
            left: -5px;
            top: 150px;
            height: 30px;
        }

        .btn.vol-up {
            left: -5px;
            top: 210px;
            height: 58px;
        }

        .btn.vol-down {
            left: -5px;
            top: 280px;
            height: 58px;
        }

        .btn.power {
            right: -5px;
            top: 240px;
            height: 90px;
        }
    </style>
</head>

<body>
    <div class="stage" id="stage">
        <div class="phone">
            <span class="btn silent"></span>
            <span class="btn vol-up"></span>
            <span class="btn vol-down"></span>
            <span class="btn power"></span>

            <div class="screen">
                <div class="island"></div>
                <iframe src="index.html" title="معاينة موقع MARO DESIGN"></iframe>
            </div>
        </div>
    </div>

    <script>
        // تصغير الإطار تلقائيًا ليناسب حجم النافذة
        function fitPhone() {
            var stage = document.getElementById("stage");
            var scale = Math.min(1, (window.innerHeight - 20) / 884, (window.innerWidth - 20) / 430);
            stage.style.transform = "scale(" + scale + ")";
        }

        window.addEventListener("resize", fitPhone);
        fitPhone();
    </script>
</body>

</html>
